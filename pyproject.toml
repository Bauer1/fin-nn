[project]
name = "fin-nn"
version = "0.1.0"
description = "Leak-free PyTorch pipeline for NVDA next-day price direction prediction using GRU"
readme = "README.md"
authors = [
    { name = "Zhumabai Baurzhan", email = "bauyrzanzumabaj654@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "tensorboard>=2.21.0",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
    "yfinance>=1.8.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]


